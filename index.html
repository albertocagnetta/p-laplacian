<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f3fafe">
<title>A uniqueness result for two-step indefinite p-Laplacian equations | Alberto Cagnetta</title>
<style>
:root {
  color-scheme: light;
  --petrol: #13526d;
  --ink: #143745;
  --sky: #dcf2fd;
  --paper: #f3fafe;
  --line: #b9d7e4;
  font-family: Georgia, "Times New Roman", serif;
}
* { box-sizing: border-box; }
body { margin: 0; color: var(--ink); background: var(--paper); }
.poster {
  display: grid;
  gap: clamp(1rem, 3vw, 2rem);
  max-width: 46rem;
  margin-inline: auto;
  padding: clamp(1.4rem, 5vw, 4rem) clamp(1rem, 5vw, 2.5rem) 2rem;
}
.author {
  margin: 0 0 .65rem;
  color: var(--petrol);
  font: 600 .76rem/1.3 system-ui, sans-serif;
  letter-spacing: .11em;
  text-transform: uppercase;
}
h1 {
  max-width: 19ch;
  margin: 0;
  font-size: clamp(1.95rem, 5.4vw, 3.65rem);
  font-weight: 500;
  line-height: 1.02;
  letter-spacing: -.045em;
  text-wrap: balance;
}
.equation { background: white; border: 1px solid var(--line); border-radius: 1.1rem; overflow: hidden; }
.equation math { padding: .8rem .4rem .25rem; font-size: clamp(1.16rem, 4.3vw, 1.75rem); }
.equation svg { display: block; width: 100%; padding: 0 .5rem .55rem; }
.actions { display: grid; gap: .65rem; }
.action {
  display: grid;
  align-items: center;
  grid-template-columns: 1.4rem minmax(0, 1fr) 1rem;
  gap: .8rem;
  padding: .8rem 1rem;
  min-height: 4.15rem;
  border: 1px solid var(--petrol);
  border-radius: .75rem;
  text-decoration: none;
  font: .95rem/1.3 system-ui, sans-serif;
}
.action svg { width: 100%; height: auto; }
.action strong { display: block; font-weight: 650; }
.action small { display: block; margin-top: .15rem; font-size: .78rem; }
.primary { background: var(--petrol); color: white; }
.primary:hover { background: #0d3f54; }
.secondary { background: white; color: var(--petrol); border-color: var(--line); }
.secondary:hover { background: var(--sky); }
.action:focus-visible { outline: 3px solid #c35214; outline-offset: 3px; }
.equation { position: relative; }
.intro-fill { position: absolute; inset: 0; background: var(--sky); pointer-events: none; opacity: 0; }
.skip-intro {
  position: fixed;
  z-index: 2;
  top: max(.75rem, env(safe-area-inset-top));
  right: max(.75rem, env(safe-area-inset-right));
  min-height: 2.75rem;
  padding: .45rem .8rem;
  border: 1px solid var(--line);
  border-radius: .5rem;
  background: var(--paper);
  color: var(--petrol);
  font: .85rem system-ui, sans-serif;
  cursor: pointer;
}
.skip-intro:focus-visible { outline: 3px solid #c35214; outline-offset: 3px; }
</style>
</head>
<body>
<button class="skip-intro" type="button" hidden>Skip intro</button>
<main class="poster">
  <header>
    <p class="author">Alberto Cagnetta</p>
    <h1>A uniqueness result for two-step indefinite <i>p</i>-Laplacian equations</h1>
  </header>

  <section class="equation" aria-label="Equation and flux illustration">
    <math display="block">
      <mrow><msup><mrow><mo>(</mo><msub><mi>ϕ</mi><mi>p</mi></msub><mo>(</mo><msup><mi>u</mi><mo>′</mo></msup><mo>)</mo><mo>)</mo></mrow><mo>′</mo></msup>
      <mo>+</mo><mi>a</mi><mo>(</mo><mi>t</mi><mo>)</mo><msup><mi>u</mi><mi>γ</mi></msup><mo>=</mo><mn>0</mn></mrow>
    </math>
    <svg viewBox="0 0 520 154" role="img" aria-label="Concentration profile above a band representing flux from left to right">
      <defs>
        <linearGradient id="flux">
          <stop stop-color="#13526d"/><stop offset=".30" stop-color="#4fb8bf"/>
          <stop offset=".5" stop-color="#f5c878"/><stop offset=".78" stop-color="#59c0c5"/>
          <stop offset="1" stop-color="#13526d"/>
        </linearGradient>
      </defs>
      <rect x="25" y="18" width="235" height="99" fill="#dcf2fd"/>
      <rect x="260" y="18" width="235" height="99" fill="#ffecd9"/>
      <path d="M25 117H495M260 18V135" fill="none" stroke="#66828e" stroke-opacity=".64" stroke-dasharray="4 5"/>
      <path class="profile" pathLength="1" d="M25.00 41.00 L32.83 41.03 L40.67 41.13 L48.50 41.29 L56.33 41.52 L64.17 41.81 L72.00 42.16 L79.83 42.58 L87.67 43.07 L95.50 43.62 L103.33 44.24 L111.17 44.92 L119.00 45.67 L126.83 46.49 L134.67 47.38 L142.50 48.33 L150.33 49.36 L158.17 50.45 L166.00 51.62 L173.83 52.85 L181.67 54.16 L189.50 55.55 L197.33 57.01 L205.17 58.54 L213.00 60.16 L220.83 61.85 L228.67 63.62 L236.50 65.48 L244.33 67.42 L252.17 69.45 L260.00 71.57 L267.83 73.71 L275.67 75.80 L283.50 77.84 L291.33 79.83 L299.17 81.78 L307.00 83.66 L314.83 85.50 L322.67 87.27 L330.50 88.99 L338.33 90.64 L346.17 92.23 L354.00 93.76 L361.83 95.22 L369.67 96.62 L377.50 97.94 L385.33 99.19 L393.17 100.37 L401.00 101.46 L408.83 102.48 L416.67 103.42 L424.50 104.28 L432.33 105.05 L440.17 105.73 L448.00 106.33 L455.83 106.84 L463.67 107.25 L471.50 107.58 L479.33 107.81 L487.17 107.95 L495.00 108.00" fill="none" stroke="#13526d" stroke-width="3" stroke-linecap="round"/>
      <rect x="25" y="125" width="470" height="8" rx="4" fill="url(#flux)"/>
      <g fill="#13526d" font-family="Georgia,serif" font-size="15" font-style="italic">
        <text x="38" y="36">u(t)</text>
        <text x="260" y="152" text-anchor="middle">τ</text>
      </g>
    </svg>
    <div class="intro-fill" aria-hidden="true"></div>
  </section>

  <nav class="actions" aria-label="Poster resources">
    <a class="action primary" href="ar/">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5M12 6l5 3v6l-5 3-5-3V9l5-3Z"/><path d="m7 9 5 3 5-3m-5 3v6"/></svg>
      <span><strong>View in augmented reality</strong><small>Point your camera at the marked figure.</small></span>
      <span aria-hidden="true">→</span>
    </a>
    <a class="action secondary" href="https://www.youtube.com/watch?v=RbK1e94p8v0" target="_blank" rel="noopener">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="4"/><path d="m10 8 6 4-6 4V8Z"/></svg>
      <span><strong>Watch the video on the ratio <i>Q</i></strong><small>YouTube</small></span>
      <span aria-hidden="true">↗</span>
    </a>
  </nav>
</main>
<script>
(() => {
  const motion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const panel = document.querySelector('.equation');
  if (motion.matches || !panel.animate || window.scrollY > 0) return;

  const { top, width, height } = panel.getBoundingClientRect();
  const offset = window.innerHeight / 2 - top - height / 2;
  const size = Math.min(110, width, height);
  const centered = `translateY(${offset}px)`;
  const square = (side, radius) =>
    `inset(${(height - side) / 2}px ${(width - side) / 2}px round ${radius}px)`;
  const full = 'inset(0px 0px round 17.6px)';
  const profile = panel.querySelector('.profile');
  const header = document.querySelector('.poster header');
  const buttons = [...document.querySelectorAll('.action')];
  const skip = document.querySelector('.skip-intro');
  const animations = [];
  const ease = 'cubic-bezier(.22, .72, .24, 1)';

  function play(element, frames, duration, delay = 0, easing = ease) {
    const animation = element.animate(frames, { duration, delay, easing, fill: 'both' });
    animations.push(animation);
    return animation;
  }

  play(panel, [
    { offset: 0, clipPath: square(8, 4), transform: centered, opacity: 0, easing: ease },
    { offset: .21, clipPath: square(size, 17.6), transform: centered, opacity: 1, easing: ease },
    { offset: .47, clipPath: full, transform: centered, opacity: 1 },
    { offset: .73, clipPath: full, transform: centered, opacity: 1, easing: ease },
    { offset: 1, clipPath: full, transform: 'translateY(0)', opacity: 1 }
  ], 2900, 0, 'linear');
  play(panel.querySelector('.intro-fill'), [{ opacity: 1 }, { opacity: 0 }], 240, 1360);
  play(profile, [{ strokeDasharray: '1', strokeDashoffset: 1 }, { strokeDasharray: '1', strokeDashoffset: 0 }], 640, 1470);
  play(header, [{ opacity: 0 }, { opacity: 1 }], 430, 2520);
  const reveal = [{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'translateY(0)' }];
  const arButton = play(buttons[0], reveal, 380, 2900);
  const videoButton = play(buttons[1], reveal, 380, 3180);
  buttons.forEach(button => { button.inert = true; });
  skip.hidden = false;

  function finish() {
    const focusWasOnSkip = document.activeElement === skip;
    animations.forEach(animation => animation.cancel());
    buttons.forEach(button => { button.inert = false; });
    if (focusWasOnSkip) buttons[0].focus();
    skip.hidden = true;
    window.removeEventListener('resize', finish);
    motion.removeEventListener('change', finish);
  }

  arButton.finished.then(() => { buttons[0].inert = false; }, () => {});
  videoButton.finished.then(finish, () => {});
  skip.addEventListener('click', finish, { once: true });
  window.addEventListener('resize', finish, { once: true });
  motion.addEventListener('change', finish, { once: true });
})();
</script>
</body>
</html>
