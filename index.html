<style>
@font-face {
  font-family: "Poster Roman";
  src: url("fonts/poster-roman.woff2") format("woff2");
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: "Poster Roman";
  src: url("fonts/poster-italic.woff2") format("woff2");
  font-style: italic;
  font-display: swap;
}
@font-face {
  font-family: "Poster Math";
  src: url("fonts/poster-math.woff2") format("woff2");
  font-display: swap;
}
:root {
  color-scheme: dark;
  --petrol: #13526d;
  --ink: #f3f8f9;
  --muted: #b8cdd4;
  --sky: #c5e5ee;
  --paper: #0a2530;
  --panel: #102f3b;
  --line: #416371;
  --radius: .75rem;
  --serif: "Poster Roman", Georgia, serif;
  --math: "Poster Math", math;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--serif); }
.hero { position: relative; display: grid; }
.wrap {
  width: min(100% - 2 * clamp(1rem, 5vw, 3rem), 53rem);
  display: grid;
  gap: clamp(1rem, 2.8vh, 1.65rem);
  margin-inline: auto;
  padding: clamp(3rem, 9svh, 5.5rem) 0 1.25rem;
}
.poster header { text-align: center; }
h1 {
  margin: 0 auto;
  font: 400 clamp(1.92rem, 5vw, 3.5rem)/1.08 var(--serif);
  letter-spacing: -.028em;
  text-wrap: balance;
}
h1 i { white-space: nowrap; }
.author { color: var(--muted); margin: .8rem 0 0; font-size: .95rem; }
.equation {
  position: relative;
  display: grid;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}
.formula {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: baseline;
  column-gap: 1.8rem;
  row-gap: .25rem;
  padding: clamp(.7rem, 2.2vw, 1.1rem);
  border-bottom: 1px solid var(--line);
}
.formula math { font-family: var(--math); font-size: clamp(1.03rem, 3.4vw, 1.5rem); }
.formula math + math { color: var(--muted); font-size: clamp(.9rem, 2.6vw, 1.18rem); }
.equation svg { display: block; width: 100%; max-height: 13.25rem; padding: .4rem .35rem .15rem; }
.actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .7rem; }
.action {
  display: grid;
  align-items: center;
  grid-template-columns: 1.2rem minmax(0, 1fr) 1rem;
  gap: .65rem;
  min-height: 3.75rem;
  padding: .7rem .95rem;
  border: 1px solid var(--petrol);
  border-radius: var(--radius);
  text-decoration: none;
  font-size: 1.06rem;
  line-height: 1.18;
  transition: background-color .2s, transform .2s;
}
.action svg { width: 100%; height: auto; }
.action strong { display: block; font-weight: 400; }
.action small { display: block; margin-top: .1rem; font-size: .88rem; }
.primary { background: var(--sky); color: #0c3543; border-color: var(--sky); }
.secondary { background: var(--panel); color: var(--ink); border-color: var(--line); }
.primary:hover { background: #e1f2f7; }
.secondary:hover { background: #194250; }
@media (hover: hover) { .action:hover { transform: translateY(-2px); } }
.action:active { transform: translateY(1px); }
:focus-visible { outline: 3px solid #f5c99d; outline-offset: 3px; }
.intro-fill { position: absolute; inset: 0; background: #1c4655; pointer-events: none; opacity: 0; }
.skip-intro, .skip-link {
  position: fixed; z-index: 2; top: .75rem; min-height: 2.75rem;
  padding: .55rem .85rem; border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--paper); color: var(--sky); font: .95rem var(--serif);
}
.skip-intro { right: .75rem; cursor: pointer; }
.skip-link { left: .75rem; transform: translateY(-200%); }
.skip-link:focus { transform: none; }
#poster { position: relative; }
.flow-background { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
.flow-background span {
  position: absolute;
  top: var(--y);
  left: var(--x);
  width: var(--size);
  height: var(--size);
  border-radius: 50%;
  background: #fff;
  opacity: var(--opacity);
  animation: drift var(--duration) var(--delay) linear infinite;
}
.flow-background.is-paused span { animation-play-state: paused; }
@keyframes drift {
  0% { transform: translate(var(--start-x), var(--start-y)); opacity: 0; }
  8%, 92% { opacity: var(--opacity); }
  100% { transform: translate(var(--end-x), var(--end-y)); opacity: 0; }
}
.motion-controls { position: relative; display: flex; justify-content: center; padding: 0 1rem .5rem; }
.motion-toggle {
  background: none; color: var(--muted); border: 0; border-radius: .25rem;
  font: .95rem var(--serif); min-height: 44px; padding-inline: .6rem; cursor: pointer;
}
.motion-toggle:hover { color: var(--ink); text-decoration: underline; }
@media (max-width: 38rem) {
  .flow-background span:nth-child(3n) { display: none; }
  .wrap { padding-top: clamp(1.5rem, 4svh, 2.5rem); }
  .actions { grid-template-columns: 1fr; }
  .author { margin-top: .6rem; }
}
@media (prefers-reduced-motion: reduce) {
  .flow-background span { animation: none; }
  .action { transition: none; }
  .action:hover, .action:active { transform: none; }
}
</style>
</head>
<body>
<div class="flow-background" aria-hidden="true"></div>
<a class="skip-link" href="#poster">Skip to content</a>
<button class="skip-intro" type="button" hidden>Skip intro</button>
<main id="poster" class="poster">
<section class="hero" data-enter aria-labelledby="poster-title">
<div class="wrap">
  <header>
    <h1 id="poster-title">A uniqueness result for two-step indefinite <i>p</i>-Laplacian equations</h1>
    <p class="author">Alberto Cagnetta · PhD poster</p>
  </header>
  <div class="equation" aria-label="Equation and stationary example">
    <div class="formula">
      <math><mrow><msup><mrow><mo>(</mo><msub><mi>ϕ</mi><mi>p</mi></msub><mo>(</mo><msup><mi>u</mi><mo>′</mo></msup><mo>)</mo><mo>)</mo></mrow><mo>′</mo></msup>
      <mo>+</mo><mi>a</mi><mo>(</mo><mi>t</mi><mo>)</mo><msup><mi>u</mi><mi>γ</mi></msup><mo>=</mo><mn>0</mn></mrow></math>
      <math><mrow><msub><mi>ϕ</mi><mi>p</mi></msub><mo>(</mo><mi>s</mi><mo>)</mo><mo>=</mo><msup><mrow><mo>|</mo><mi>s</mi><mo>|</mo></mrow><mrow><mi>p</mi><mo>−</mo><mn>2</mn></mrow></msup><mi>s</mi></mrow></math>
    </div>
    <svg data-visual viewBox="0 0 720 184" role="img" aria-labelledby="plot-title" focusable="false">
      <title id="plot-title">Decreasing solution u(t) with an inflection at the interface, shown for p = 2.</title>
      <path fill="#174858" d="M48 33H360V150H48Z"/>
      <path fill="#433b39" d="M360 33H672V150H360Z"/>
      <path fill="none" stroke="#92aab1" stroke-opacity=".68" stroke-dasharray="4 5" d="M360 33V150"/>
      <rect x="48" y="33" width="624" height="117" fill="none" stroke="#9bb5bd" stroke-opacity=".77" vector-effect="non-scaling-stroke"/>
      <path class="profile" pathLength="1" d="M48.0 54.1 L58.4 54.1 L68.8 54.2 L79.2 54.4 L89.6 54.6 L100.0 54.9 L110.4 55.2 L120.8 55.6 L131.2 56.0 L141.6 56.5 L152.0 57.1 L162.4 57.7 L172.8 58.4 L183.2 59.2 L193.6 60.0 L204.0 60.8 L214.4 61.8 L224.8 62.8 L235.2 63.9 L245.6 65.0 L256.0 66.2 L266.4 67.5 L276.8 68.8 L287.2 70.2 L297.6 71.7 L308.0 73.3 L318.4 74.9 L328.8 76.6 L339.2 78.4 L349.6 80.3 L360.0 82.2 L370.4 84.2 L380.8 86.1 L391.2 88.0 L401.6 89.8 L412.0 91.6 L422.4 93.3 L432.8 95.0 L443.2 96.6 L453.6 98.2 L464.0 99.7 L474.4 101.2 L484.8 102.6 L495.2 103.9 L505.6 105.2 L516.0 106.4 L526.4 107.6 L536.8 108.7 L547.2 109.7 L557.6 110.6 L568.0 111.5 L578.4 112.3 L588.8 113.0 L599.2 113.6 L609.6 114.2 L620.0 114.6 L630.4 115.0 L640.8 115.3 L651.2 115.5 L661.6 115.6 L672.0 115.7" fill="none" stroke="#e2f3f7" stroke-width="2.6" vector-effect="non-scaling-stroke" stroke-linecap="round"/>
      <g style="font-family:var(--math)" font-size="23" fill="#dcecf0">
        <text x="48" y="25">𝑢(𝑡)</text>
        <text x="672" y="25" text-anchor="end">𝑝 = 2</text>
        <text x="150" y="139" fill="#ccecf5" text-anchor="middle">𝑎(𝑡) &gt; 0</text>
        <text x="567" y="139" fill="#f3d3b9" text-anchor="middle">𝑎(𝑡) &lt; 0</text>
        <text x="48" y="175" text-anchor="middle">0</text>
        <text x="360" y="175" text-anchor="middle">𝜏</text>
        <text x="672" y="175" text-anchor="middle">𝑇</text>
      </g>
    </svg>
    <div class="intro-fill" aria-hidden="true"></div>
  </div>
    <nav class="actions" aria-label="Poster resources">
    <a class="action primary" href="ar/">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5M12 6l5 3v6l-5 3-5-3V9l5-3Z"/><path d="m7 9 5 3 5-3m-5 3v6"/></svg>
      <span><strong>View in augmented reality</strong><small>Scan the marked figure on the poster.</small></span>
      <span aria-hidden="true">→</span>

      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="4"/><path d="m10 8 6 4-6 4V8Z"/></svg>
      <span><strong>Watch the video on the ratio <i>Q</i></strong><small>YouTube</small></span>

    </a>
  </nav>
</div>
</section>
</main>
<div class="motion-controls"><button class="motion-toggle" type="button" hidden>Pause background</button></div>
<script>
(() => {
  const motion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const background = document.querySelector('.flow-background');
  const dots = document.createDocumentFragment();
  const columns = 12;
  const rows = 12;
  for (let index = 0; index < columns * rows; index++) {
    const x = (Math.floor(index / rows) + Math.random()) / columns;
    const y = ((index + Math.floor(index / rows)) % rows + Math.random()) / rows;
    const before = Math.min(x, y) + .018;
    const after = Math.min(1 - x, 1 - y) + .018;
    const crossingTime = 40 + Math.random() * 25;
    const dot = document.createElement('span');
    dot.style.cssText = `
      --x: ${x * 100}%; --y: ${y * 100}%;
      --start-x: ${-before * 100}vw; --start-y: ${-before * 100}vh;
      --end-x: ${after * 100}vw; --end-y: ${after * 100}vh;
      --duration: ${(before + after) * crossingTime}s;
      --delay: ${-before * crossingTime}s;
      --size: ${1.1 + Math.random() * 1.5}px;
      --opacity: ${.26 + Math.random() * .38};
    `;
    dots.append(dot);
  }
  background.append(dots);
  const toggle = document.querySelector('.motion-toggle');
  let introRunning = false;
  function updateMotionControl() {
    toggle.hidden = motion.matches || introRunning;
  }
  toggle.addEventListener('click', () => {
    const paused = background.classList.toggle('is-paused');
    toggle.textContent = paused ? 'Resume background' : 'Pause background';
  });
  motion.addEventListener('change', updateMotionControl);
  updateMotionControl();

  const panel = document.querySelector('.equation');
  if (motion.matches || !panel.animate || window.scrollY > 0) return;

  const { top, width, height } = panel.getBoundingClientRect();
  const offset = window.innerHeight / 2 - top - height / 2;
  const size = Math.min(110, width, height);
  const centered = `translateY(${offset}px)`;
  const square = (side, radius) =>
    `inset(${(height - side) / 2}px ${(width - side) / 2}px round ${radius}px)`;
  const radius = parseFloat(getComputedStyle(panel).borderTopLeftRadius);
  const full = `inset(0px 0px round ${radius}px)`;
  const profile = panel.querySelector('.profile');
  const header = document.querySelector('.poster header');
  const buttons = [...document.querySelectorAll('.action')];
  const skip = document.querySelector('.skip-intro');
  const animations = [];
  const ease = 'cubic-bezier(.22, .72, .24, 1)';

  function play(element, frames, duration, delay = 0, easing = ease) {
    const animation = element.animate(frames, { duration, delay, easing, fill: 'both' });
    animations.push(animation);
    return animation;
  }

  play(panel, [
    { offset: 0, clipPath: square(8, 4), transform: centered, opacity: 0, easing: ease },
    { offset: .12, clipPath: square(size, radius), transform: centered, opacity: 1, easing: ease },
    { offset: .25, clipPath: full, transform: centered, opacity: 1 },
    { offset: .78, clipPath: full, transform: centered, opacity: 1, easing: ease },
    { offset: 1, clipPath: full, transform: 'translateY(0)', opacity: 1 }
  ], 5200, 0, 'linear');
  play(panel.querySelector('.intro-fill'), [{ opacity: 1 }, { opacity: 0 }], 520, 1300);
  play(profile, [{ strokeDasharray: '1', strokeDashoffset: 1 }, { strokeDasharray: '1', strokeDashoffset: 0 }], 1950, 1740);
  play(header, [{ opacity: 0 }, { opacity: 1 }], 720, 4500);
  const reveal = [{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'translateY(0)' }];
  const arButton = play(buttons[0], reveal, 520, 5200);
  const videoButton = play(buttons[1], reveal, 520, 5700);
  buttons.forEach(button => { button.inert = true; });
  skip.hidden = false;
  introRunning = true;
  updateMotionControl();

  function finish() {
    const focusWasOnSkip = document.activeElement === skip;
    animations.forEach(animation => animation.cancel());
    buttons.forEach(button => { button.inert = false; });
    if (focusWasOnSkip) buttons[0].focus();
    skip.hidden = true;
    introRunning = false;
    updateMotionControl();
    window.removeEventListener('resize', finish);
    motion.removeEventListener('change', finish);
  }

  arButton.finished.then(() => { buttons[0].inert = false; }, () => {});
  videoButton.finished.then(finish, () => {});
  skip.addEventListener('click', finish, { once: true });
  document.querySelector('.skip-link').addEventListener('click', finish, { once: true });
  window.addEventListener('resize', finish, { once: true });
  motion.addEventListener('change', finish, { once: true });
})();
</script>
</body>
