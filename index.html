* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); }
.hero { min-height: 100svh; display: grid; align-items: start; }
.wrap {

  letter-spacing: -.045em;

}
h1 i { white-space: nowrap; }
.author { color: var(--muted); margin: .8rem 0 0; font-size: .95rem; }
.equation {
  position: relative;
  display: grid;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}
.formula {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: baseline;
  column-gap: 1.8rem;
  row-gap: .25rem;
  padding: clamp(.7rem, 2.2vw, 1.1rem);
  border-bottom: 1px solid var(--line);
}
.formula math { font-size: clamp(1.03rem, 3.4vw, 1.5rem); }
.formula math + math { color: var(--muted); font-size: clamp(.9rem, 2.6vw, 1.18rem); }
.equation svg { display: block; width: 100%; max-height: 15.5rem; padding: .45rem .35rem .2rem; }
.actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .7rem; }
.action {
  display: grid;
  align-items: center;
  grid-template-columns: 1.2rem minmax(0, 1fr) 1rem;
  gap: .65rem;
  min-height: 3.75rem;
  padding: .7rem .95rem;
  border: 1px solid var(--petrol);
  border-radius: var(--radius);
  text-decoration: none;
  font-size: .95rem;
  line-height: 1.3;
  transition: background-color .2s, transform .2s;
}
.action svg { width: 100%; height: auto; }
.action strong { display: block; font-weight: 650; }
.action small { display: block; margin-top: .1rem; font-size: .75rem; }
.primary { background: var(--petrol); color: white; }
.secondary { background: white; color: var(--petrol); border-color: var(--line); }
.primary:hover { background: #0d3f54; }
.secondary:hover { background: var(--sky); }
@media (hover: hover) { .action:hover { transform: translateY(-2px); } }
.action:active { transform: translateY(1px); }
:focus-visible { outline: 3px solid #a84815; outline-offset: 3px; }
.intro-fill { position: absolute; inset: 0; background: var(--sky); pointer-events: none; opacity: 0; }
.skip-intro, .skip-link {
  position: fixed; z-index: 2; top: .75rem; min-height: 2.75rem;
  padding: .55rem .85rem; border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--paper); color: var(--petrol); font: .85rem var(--sans);
}
.skip-intro { right: .75rem; cursor: pointer; }
.skip-link { left: .75rem; transform: translateY(-200%); }
.skip-link:focus { transform: none; }
@media (max-width: 38rem) {
  .wrap { padding-top: clamp(1.5rem, 4svh, 2.5rem); }
  .actions { grid-template-columns: 1fr; }
  .author { margin-top: .6rem; }
}
@media (prefers-reduced-motion: reduce) {
  .action { transition: none; }
  .action:hover, .action:active { transform: none; }
}
</style>

<script>
(() => {
  const motion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const panel = document.querySelector('.equation');
  if (motion.matches || !panel.animate || window.scrollY > 0) return;

  const { top, width, height } = panel.getBoundingClientRect();
  const offset = window.innerHeight / 2 - top - height / 2;
  const size = Math.min(110, width, height);
  const centered = `translateY(${offset}px)`;
  const square = (side, radius) =>
    `inset(${(height - side) / 2}px ${(width - side) / 2}px round ${radius}px)`;
  const radius = parseFloat(getComputedStyle(panel).borderTopLeftRadius);
  const full = `inset(0px 0px round ${radius}px)`;
  const profile = panel.querySelector('.profile');
  const header = document.querySelector('.poster header');
  const buttons = [...document.querySelectorAll('.action')];
  const skip = document.querySelector('.skip-intro');
  const animations = [];
  const ease = 'cubic-bezier(.22, .72, .24, 1)';

  function play(element, frames, duration, delay = 0, easing = ease) {
    const animation = element.animate(frames, { duration, delay, easing, fill: 'both' });
    animations.push(animation);
    return animation;
  }

  play(panel, [
    { offset: 0, clipPath: square(8, 4), transform: centered, opacity: 0, easing: ease },
    { offset: .21, clipPath: square(size, radius), transform: centered, opacity: 1, easing: ease },
    { offset: .47, clipPath: full, transform: centered, opacity: 1 },
    { offset: .73, clipPath: full, transform: centered, opacity: 1, easing: ease },
    { offset: 1, clipPath: full, transform: 'translateY(0)', opacity: 1 }
  ], 2900, 0, 'linear');
  play(panel.querySelector('.intro-fill'), [{ opacity: 1 }, { opacity: 0 }], 240, 1360);
  play(profile, [{ strokeDasharray: '1', strokeDashoffset: 1 }, { strokeDasharray: '1', strokeDashoffset: 0 }], 640, 1470);
  play(header, [{ opacity: 0 }, { opacity: 1 }], 430, 2520);
  const reveal = [{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'translateY(0)' }];
  const arButton = play(buttons[0], reveal, 380, 2900);
  const videoButton = play(buttons[1], reveal, 380, 3180);
  buttons.forEach(button => { button.inert = true; });
  skip.hidden = false;

  function finish() {
    const focusWasOnSkip = document.activeElement === skip;
    animations.forEach(animation => animation.cancel());
    buttons.forEach(button => { button.inert = false; });
    if (focusWasOnSkip) buttons[0].focus();
    skip.hidden = true;
    window.removeEventListener('resize', finish);
    motion.removeEventListener('change', finish);
  }

  arButton.finished.then(() => { buttons[0].inert = false; }, () => {});
  videoButton.finished.then(finish, () => {});
  skip.addEventListener('click', finish, { once: true });
  document.querySelector('.skip-link').addEventListener('click', finish, { once: true });
  window.addEventListener('resize', finish, { once: true });
  motion.addEventListener('change', finish, { once: true });
})();
</script>
